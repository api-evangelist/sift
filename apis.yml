name: Sift
kind: company
description: Sift is a digital trust and safety platform that uses machine learning
  to detect and prevent online fraud and abuse - payment fraud, account takeover,
  account abuse, content abuse, and promotion abuse. Applications stream user events
  to the Sift Events API, retrieve real-time risk Sift Scores (0-100) per abuse type,
  and act on them through the Decisions API, automated Workflows, verification (OTP),
  and PSP merchant risk management. Sift exposes a documented public REST API over
  HTTPS at https://api.sift.com with API-key authentication.
