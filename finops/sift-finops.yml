description: >-
  FinOps view of Sift spend. Sift is a commercial digital trust and safety
  platform billed under a custom, sales-negotiated agreement rather than public
  usage rates. Cost is typically driven by the products enabled (Payment
  Protection, Account Defense, Content Integrity, Dispute Management, plus add-ons
  like PSP Merchant Management and Verification) and by assessed volume - events,
  transactions, or users scored. Because pricing is bespoke and not published,
  the meters and columns below are modeled to structure cost tracking, not
  reconciled against a Sift rate card.
notes: >-
  Per-unit rates are not reconciled here; obtain them from your Sift agreement.
  The dominant cost drivers are contracted product scope and assessed volume.
  Verification (OTP delivery) and PSP Merchant Management may carry separate
  add-on costs. Confirm all figures during procurement and true-up.
sources:
- https://sift.com/
