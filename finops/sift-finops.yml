  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Sift
serviceCategory: Security and Fraud Prevention
billingModel:
  pricingCategory: Committed-Use
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Sift Digital Trust and Safety Platform
  ServiceCategory: Security and Fraud Prevention
  ProviderName: Sift
  PublisherName: Sift
  InvoiceIssuerName: Sift
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Committed-Use
meters:
- name: events_assessed
  description: User events / transactions sent to the Events API and scored, the primary volume driver. Rate per commercial agreement.
  unit: events
  aggregation: sum
  dimensions:
  - account
  - product
  - abuse_type
- name: users_scored
  description: Distinct users assessed for risk in a period, an alternative volume basis in some agreements.
  unit: users
  aggregation: sum
  dimensions:
  - account
  - product
- name: verifications_sent
  description: One-time passcodes sent via the Verification API; may carry add-on cost including OTP delivery.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - channel
- name: psp_merchants_managed
  description: Sub-merchant profiles monitored via PSP Merchant Management, relevant to payment service providers.
  unit: merchants
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track assessed event / user volume per product and abuse type against the contracted commitment to avoid overage surprises.
- name: Allocation
  description: Tag events by product line (payment, account, content) and business unit so trust-and-safety spend maps to internal cost centers.
- name: Optimization
  description: Scope which events are sent for scoring and which abuse types are enabled; use Workflows to avoid redundant synchronous scoring; right-size add-ons like Verification and PSP Merchant Management.
- name: Accountability
  description: Assign an owner for the Sift agreement; review monthly assessed volume against the committed tier and true-up at renewal.
